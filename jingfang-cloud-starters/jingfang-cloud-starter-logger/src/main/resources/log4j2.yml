Configutation:
  name: Default
  status: warn
  shutdownHook: disable
  Appenders:
    Console:
      name: Console-Appender
      target: SYSTEM_OUT
      PatternLayout:
        disableAnsi: false
        pattern: "[%-5p] %d{ISO8601} [%t] %c{1} - %m%n%throwable"
  Loggers:
    Root:
      level: WARN
      AppenderRef:
        - ref: Console-Appender
    Logger:
      - name: com.jingfang.cloud
        level: 'INFO'